
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b13">
    <meta name="description" content="GamingOS - A gaming-focused web desktop.">
    <title>GamingOS Liquid Edition</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

    <!-- BOOT SCREEN -->
    <div id="boot" class="boot-screen">
        <div class="boot-logo">G</div>
        <div class="boot-name">Gaming<span>OS</span></div>
        <div class="boot-track">
            <div class="boot-progress"></div>
        </div>
        <p>STARTING GAMINGOS WEB EDITION</p>
    </div>

    <!-- DESKTOP -->
    <main id="desktop" class="desktop hidden">

        <div class="wallpaper"></div>

        <!-- TOP BAR -->
        <header class="topbar">

            <button class="brand" id="brandButton">
                <span class="brand-logo">G</span>
                GamingOS
            </button>

            <div class="topbar-center" id="activeTitle">
                WEB DESKTOP
            </div>

            <div class="topbar-right">
                <span class="online-dot"></span>
                <span>ONLINE</span>
                <span id="clock">00:00</span>
            </div>

        </header>

        <!-- DESKTOP ICONS -->
        <section class="desktop-icons">

            <button class="desktop-icon" data-app="browser">
                <span class="icon browser-icon">◎</span>
                <span>Browser</span>
            </button>

            <button class="desktop-icon" data-app="games">
                <span class="icon games-icon">🎮</span>
                <span>Games</span>
            </button>

            <button class="desktop-icon" data-app="files">
                <span class="icon files-icon">📁</span>
                <span>Files</span>
            </button>

            <button class="desktop-icon" data-app="settings">
                <span class="icon settings-icon">⚙</span>
                <span>Settings</span>
            </button>

            <button class="desktop-icon" data-app="terminal">
                <span class="icon terminal-icon">>_</span>
                <span>Terminal</span>
            </button>

        </section>

        <!-- APPLICATION WINDOWS -->
        <div id="windowLayer"></div>

        <!-- START MENU -->
        <section id="startMenu" class="start-menu hidden">

            <div class="start-search">
                <span>⌕</span>
                <input id="appSearch" placeholder="Search applications...">
            </div>

            <h3>Pinned applications</h3>

            <div class="pinned-grid">

                <button data-app="browser">
                    <span class="mini browser-icon">◎</span>
                    Browser
                </button>

                <button data-app="games">
                    <span class="mini games-icon">🎮</span>
                    Games
                </button>

                <button data-app="files">
                    <span class="mini files-icon">📁</span>
                    Files
                </button>

                <button data-app="settings">
                    <span class="mini settings-icon">⚙</span>
                    Settings
                </button>

                <button data-app="calculator">
                    <span class="mini calculator-icon">＋</span>
                    Calculator
                </button>

                <button data-app="terminal">
                    <span class="mini terminal-icon">>_</span>
                    Terminal
                </button>

                <button data-app="notes">
                    <span class="mini files-icon">✎</span>
                    Notes
                </button>

            </div>

            <div class="start-footer">
                <span>GamingOS Web Edition</span>
                <button id="restartButton">Refresh desktop ↻</button>
            </div>

        </section>

        <!-- DOCK -->
        <footer class="taskbar">

            <button id="startButton" class="start-button" aria-label="Start menu">
                <span>G</span>
            </button>

            <div id="taskApps"></div>

            <div class="system-tray">
                <span>⌨</span>
                <span>◉</span>
                <span id="taskClock">00:00</span>
            </div>

        </footer>

        <!-- NOTIFICATIONS -->
        <div id="toast" class="toast hidden"></div>

    </main>

</body>
</html>
