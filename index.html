
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamingOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="boot">
        <div class="boot-logo">G</div>
        <h2>GamingOS</h2>
        <div class="loader"></div>
    </div>

    <main id="desktop" class="hidden">
        <div class="wallpaper"></div>

        <header class="topbar">
            <button id="activities">Activities</button>
            <div id="clock"></div>
            <button id="systemButton">⌄</button>
        </header>

        <aside class="dock">
            <button class="dock-app" data-app="browser" title="Browser">🌐</button>
            <button class="dock-app" data-app="files" title="Files">📁</button>
            <button class="dock-app" data-app="terminal" title="Terminal">▣</button>
            <button class="dock-app" data-app="notes" title="Notes">📝</button>
            <button class="dock-app" data-app="settings" title="Settings">⚙</button>
            <div class="dock-separator"></div>
            <button id="showApps" title="Show Applications">▦</button>
        </aside>

        <section id="workspace"></section>

        <section id="overview" class="hidden">
            <input id="searchApps" placeholder="Search applications..." autocomplete="off">
            <div id="runningApps"></div>
            <div id="appGrid"></div>
        </section>

        <section id="systemPanel" class="hidden">
            <h3>Quick Settings</h3>
            <button class="toggle">◉ Wi-Fi</button>
            <button class="toggle">ᛒ Bluetooth</button>
            <button class="toggle">☾ Night Light</button>
            <label>Brightness <input type="range" min="20" max="100" value="85" id="brightness"></label>
            <label>Volume <input type="range" min="0" max="100" value="65"></label>
            <button id="openSettings">All Settings</button>
            <button id="shutdown">⏻ Power Off</button>
        </section>

        <div id="toast"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
